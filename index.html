'use strict';const audio=document.getElementById('bgm'),music=document.getElementById('music');let opened=false,heartTimer=null;audio.volume=.85;
function updateMusic(){const active=!audio.paused;music.textContent=active?'🔊 音楽 ON':'🎵 音楽を再生';music.setAttribute('aria-pressed',String(active))}
function playMusic(){const p=audio.play();if(p&&p.then)p.then(updateMusic).catch(()=>{music.textContent='🎵 タップして再生';music.setAttribute('aria-pressed','false')});else updateMusic()}
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
function flash(){const f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(()=>f.remove(),950)}
function burst(count=48){flash();const colors=['#ff7eb6','#ffd56f','#a9a0ff','#8ee1d4','#ff9e8d','#ffffff'];for(let i=0;i<count;i++){const e=document.createElement('span');e.className='confetti';e.style.setProperty('--x',Math.random()*100+'vw');e.style.setProperty('--color',colors[i%colors.length]);e.style.setProperty('--dur',(2.5+Math.random()*2.8)+'s');e.style.setProperty('--dx',(Math.random()*200-100)+'px');e.style.setProperty('--round',Math.random()>.65?'50%':'2px');e.style.width=(5+Math.random()*7)+'px';e.style.height=(6+Math.random()*9)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),5700)}hearts(12)}
function hearts(n){for(let i=0;i<n;i++){setTimeout(()=>{if(document.hidden)return;const e=document.createElement('span');e.className='particle';e.textContent=['♡','💗','💕','💖','✨'][Math.floor(Math.random()*5)];e.style.setProperty('--x',(5+Math.random()*90)+'vw');e.style.setProperty('--size',(13+Math.random()*16)+'px');e.style.setProperty('--dur',(5.5+Math.random()*3.5)+'s');e.style.setProperty('--dx',(Math.random()*160-80)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),9300)},i*90)}}
function openGift(){if(opened)return;opened=true;document.getElementById('intro').classList.add('hidden');document.getElementById('reveal').classList.remove('hidden');playMusic();burst();heartTimer=setInterval(()=>{if(!document.hidden)hearts(3)},4200)}
document.getElementById('gift').addEventListener('click',openGift);document.getElementById('open').addEventListener('click',openGift);music.addEventListener('click',()=>{if(audio.paused)playMusic();else{audio.pause();updateMusic()}});document.getElementById('again').addEventListener('click',()=>burst(60));audio.addEventListener('play',updateMusic);audio.addEventListener('pause',updateMusic);
const decor=document.getElementById('decor');for(let i=0;i<38;i++){const s=document.createElement('span');s.className='star';s.textContent=i%3===0?'✦':'✧';s.style.left=(Math.random()*96)+'%';s.style.top=(Math.random()*96)+'%';s.style.setProperty('--size',(12+Math.random()*15)+'px');s.style.animationDelay=(-Math.random()*4)+'s';s.style.color=['#f6b2d3','#e9bb5c','#bca6ed'][i%3];decor.appendChild(s)}
const cardStars=document.getElementById('cardStars');for(let i=0;i<27;i++){const t=document.createElement('span');t.className='tiny-star';t.textContent=['✦','✧','⋆','✳'][i%4];t.style.setProperty('--left',(Math.random()*96)+'%');t.style.setProperty('--top',(Math.random()*96)+'%');t.style.setProperty('--size',(9+Math.random()*14)+'px');t.style.setProperty('--color',['#ffc66c','#ff94cb','#a88af2'][i%3]);t.style.setProperty('--dur',(2+Math.random()*3)+'s');t.style.setProperty('--delay',(-Math.random()*5)+'s');cardStars.appendChild(t)}
